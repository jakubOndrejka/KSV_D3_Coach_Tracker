<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Private coach reliability and culture tracker for KSV D3.">
  <title>KSV D3 Coach Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand-button" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="KSV D3 home">
      <span class="brand-mark">D3</span><span>KSV Coach</span>
    </button>
    <span id="connectionStatus" class="connection-status">Starting…</span>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation" hidden>
    <button data-tab="dashboard" class="active"><span>⌂</span><small>Dashboard</small></button>
    <button data-tab="session"><span>●</span><small>Session</small></button>
    <button data-tab="players"><span>◎</span><small>Players</small></button>
    <button data-tab="attendance"><span>▥</span><small>Attendance</small></button>
    <button data-tab="settings"><span>⚙</span><small>Settings</small></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
